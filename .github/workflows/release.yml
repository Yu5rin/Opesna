name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Windows)
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Opesna.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (macOS)
        run: npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/*.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist/

      # リリース本文は「変更点」と「ダウンロード」（ファイル・サイズ・SHA256 の表）の2節だけにし、
      # インストールや更新の方法は README に置く。変更点は公開後に手で書き換える。
      # 自動生成の本文（generate_release_notes）は Full Changelog のリンクしか入らないので使わない。
      # サイズは 1MB 以上を「12.3 MB」、未満を「456.7 KB」（1024 で割り小数1桁）で書く。
      - name: 本文の骨組みを作る
        env:
          LC_ALL: C
        run: |
          {
            echo '## 変更点'
            echo
            echo '(ここに書く)'
            echo
            echo '## ダウンロード'
            echo
            echo '| ファイル | サイズ | SHA256 |'
            echo '|---|---|---|'
            for f in dist/*; do
              name=$(basename "$f")
              bytes=$(stat -c %s "$f")
              size=$(awk -v b="$bytes" 'BEGIN { if (b >= 1048576) printf "%.1f MB", b / 1048576; else printf "%.1f KB", b / 1024 }')
              sha=$(sha256sum "$f" | cut -d ' ' -f 1)
              echo "| $name | $size | \`$sha\` |"
            done
            echo
            echo "インストールと更新の方法は [README](${{ github.server_url }}/${{ github.repository }}#インストール) をご覧ください。"
          } > release-notes.md
          cat release-notes.md

      # タイトルはタグと同じ表記（v1.0.1 など）にする
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
