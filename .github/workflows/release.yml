name: Release

on:
  push:
    tags:
      # タグの v は半角で打つ（README の「開発」の節）。最初の版のタグは全角の「ｖ1.0.0」で、
      # この条件には合わない。全角に合わせて条件を広げることはせず、今後のタグを半角にそろえる。
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # タグ（v を除いたもの）と package.json の version がずれていると、自動更新
      # （app/updater.js）が「新しい版がある」と誤判定したり、リリースページのタグと
      # アプリの版表示が食い違ったりする。ビルドの前に止める。
      - name: タグと package.json の版が一致するか確かめる
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::タグ(${GITHUB_REF_NAME})と package.json の version(${pkg_version})が一致しません。package.json の version を先に上げてから、同じ版でタグを打ち直してください。"
            exit 1
          fi

      # package.json の build:win（と build:mac）には --publish never を付けている。
      # electron-builder はタグの付いた CI では自分で GitHub へ上げようとし（onTag）、
      # トークンを渡していないため mac の zip で「GitHub Personal Access Token is not set」
      # と止まった（v1.0.2 の初回、2026-09-25）。Windows の portable は上げる対象に
      # ならないため通っていた。リリースは下の release ジョブがまとめて作るので、
      # 組み立ての段では上げない。
      - name: Build (Windows)
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Opesna.exe

  release:
    # mac 版はリリースに載せない（2026-09-25 に決めた）。組み立ての命令が設定の x64 を
    # 上書きして Apple シリコン向けしか作られず、署名もアイコンも無かったため、v1.0.2 でも
    # 手で外して公開した。載せ直すときは Intel 向け・アイコン・署名をそろえてから戻す。
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      # リリース本文は「変更点」と「ダウンロード」（ファイル・サイズ・SHA256 の表）の2節だけにし、
      # インストールや更新の方法は README に置く。下書きで作り、変更点を書き入れてから公開する。
      # 自動生成の本文（generate_release_notes）は Full Changelog のリンクしか入らないので使わない。
      # サイズは 1MB 以上を「12.3 MB」、未満を「456.7 KB」（1024 で割り小数1桁）で書く。
      #
      # 【自動更新との関係】自動更新（app/updater.js）が照合する SHA256 は、この本文の表からは
      # 読まない。GitHub がリリースのアセットごとに自動で持つ digest（GitHub API の
      # releases/tags/{tag} が返す JSON の assets[].digest）を読む。本文は人が変更点を
      # 書き入れる下書きであり、あとから自由に書き換えられるため、自動更新の判断材料にはしない
      # （/home/user/yu5rin/pane の UpdateService.cs・仕様書 U-03 と同じ考え方）。
      # この表の SHA256 は、利用者が手元でファイルを確かめたいときのためのもの。
      - name: 本文の骨組みを作る
        env:
          LC_ALL: C
        run: |
          {
            echo '## 変更点'
            echo
            echo '(ここに書く)'
            echo
            echo '## ダウンロード'
            echo
            echo '| ファイル | サイズ | SHA256 |'
            echo '|---|---|---|'
            for f in dist/*; do
              name=$(basename "$f")
              bytes=$(stat -c %s "$f")
              size=$(awk -v b="$bytes" 'BEGIN { if (b >= 1048576) printf "%.1f MB", b / 1048576; else printf "%.1f KB", b / 1024 }')
              sha=$(sha256sum "$f" | cut -d ' ' -f 1)
              echo "| $name | $size | \`$sha\` |"
            done
            echo
            echo "インストールと更新の方法は [README](${{ github.server_url }}/${{ github.repository }}#インストール) をご覧ください。"
          } > release-notes.md
          cat release-notes.md

      # タイトルはタグと同じ表記（v1.0.1 など）にする
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
          draft: true
